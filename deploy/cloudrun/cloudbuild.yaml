# Builds the RetroBoards image from a pushed GitHub commit and rolls it out to
# the Cloud Run service and the scheduled console jobs.
# Runbook: docs/runbooks/deployment-cloud-run.md
#
# Every push to main runs this through the `retroboards-main` webhook trigger,
# which holds a copy of this file: after editing it, run configure.sh, which
# refreshes that copy (runbook §5). To deploy a pushed commit by hand:
#
#   gcloud builds submit --no-source --region=us-east4 \
#     --config=deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_SHA="$(git rev-parse HEAD)"
#
# Only the image changes here. Service and job settings (env, secrets, Cloud SQL,
# the /data bucket, scaling) live on the resources themselves; see the runbook.

substitutions:
  _SHA: ""
  _REGION: us-east4
  _IMAGE: us-east4-docker.pkg.dev/rising-woods-449718-v6/retroboards/app
  _SERVICE: retroboards

serviceAccount: projects/rising-woods-449718-v6/serviceAccounts/retroboards-deploy@rising-woods-449718-v6.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  # The webhook trigger also passes _REF, which only its filter reads.
  substitutionOption: ALLOW_LOOSE

steps:
  - id: source
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ -z "${_SHA}" ]; then
          echo "_SHA (the commit to deploy) is required" >&2
          exit 1
        fi
        git init -q .
        git remote add origin https://github.com/henryperkins/community-forums.git
        git fetch -q --depth=1 origin "${_SHA}"
        git checkout -q FETCH_HEAD

  # Reuses the previous image's layers (the PHP extension build is the slow
  # part) through BuildKit's inline cache.
  - id: build
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --cache-from=${_IMAGE}:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --tag=${_IMAGE}:${_SHA}
      - --tag=${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]

  # The new revision migrates on boot (RUN_MIGRATIONS=true on the service) and
  # takes traffic only once it is serving, so the jobs below never run new code
  # against an old schema.
  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, deploy, "${_SERVICE}", "--image=${_IMAGE}:${_SHA}", "--region=${_REGION}", --quiet]

  # The cron jobs are whatever configure.sh labelled role=cron; finding none
  # means the labels drifted, which must fail loudly rather than skip them.
  - id: update-jobs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        jobs=$$(gcloud run jobs list --region=${_REGION} \
          --filter="metadata.labels.app=retroboards AND metadata.labels.role=cron" \
          --format="value(metadata.name)")
        if [ -z "$$jobs" ]; then
          echo "no Cloud Run jobs labelled app=retroboards,role=cron" >&2
          exit 1
        fi
        for job in $$jobs; do
          gcloud run jobs update "$$job" --image=${_IMAGE}:${_SHA} --region=${_REGION} --quiet
        done
