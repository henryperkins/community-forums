app = "community-forums"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_DEBUG = "false"
  APP_ENV = "production"
  APP_URL = "https://community-forums.fly.dev"
  PACKAGES_STORAGE_PATH = "/data/packages"
  RATELIMIT_PATH = "/data/ratelimit"
  SECURITY_HSTS = "true"
  SESSION_SECURE = "true"
  UPLOADS_PATH = "/data/media"

[deploy]
  release_command = "php bin/console migrate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[mounts]]
  source = "community_forums_data"
  destination = "/data"
  initial_size = "3gb"
