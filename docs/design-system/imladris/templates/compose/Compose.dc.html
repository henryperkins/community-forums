<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Compose" description="/compose — opening a topic. Its own surface rather than a pane of the board index, because writing is a task with a draft, a destination and a guard against leaving: it takes the whole main pane and it must be reachable from anywhere, not only from the directory. Shared board rail on the left, doubling as the destination picker; no third pane." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  html { scrollbar-gutter: stable; }
  body { margin: 0; background: var(--surface-page); }
  @keyframes cpRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes cpFade { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>

<div data-screen-label="Compose" style="height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body);">

  <!-- ── Topbar — ForumNav. No compose button on the compose surface, and no
       active pill: /compose is not in topbar.php's $isBoards. ── -->
  <x-import component-from-global-scope="ImladrisDesignSystem_c3e027.ForumNav" surface="compose" inbox-count="6" notification-count="3" rail-open="{{ railOpen }}" onToggleRail="{{ toggleRail }}" show-compose="{{ false }}" viewer="{{ viewer }}" hint-size="100%,62px"></x-import>

  <div style="flex: 1; min-height: 0; display: flex; align-items: stretch;">

    <!-- The rail is the destination picker here — the one surface where clicking
         a board sets where the draft lands instead of navigating away from it.
         Same component, same shape, picker semantics: onNavigate instead of an
         href, "posting here" on the active row, denied boards shown locked. -->
    <x-import component-from-global-scope="ImladrisDesignSystem_c3e027.BoardRail" categories="{{ categories }}" active-board="{{ board }}" onNavigate="{{ pickBoard }}" active-note="posting here" open="{{ railOpen }}" hint-size="272px,100%">
      <x-import component-from-global-scope="ImladrisDesignSystem_c3e027.PresenceList" people="{{ roster }}" count="{{ onlineCount }}" max="{{ rosterMax }}" layout="list" all-href="../users-online/UsersOnline.dc.html" hint-size="100%,230px"></x-import>
    </x-import>

    <div style="flex: 1 1 0; min-width: 0; overflow-y: auto; padding: 26px 40px 90px; box-sizing: border-box;">
      <div style="max-width: 700px; margin: 0 auto; animation: cpRise 200ms ease-out;">

        <p style="margin: 0; font-family: var(--font-label); font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink);">Posting to {{ boardName }}</p>
        <h1 style="margin: 7px 0 0; font-family: var(--font-display); font-weight: 500; font-size: 2.2rem; line-height: 1.08; letter-spacing: -0.01em; color: var(--text-strong);">Open a topic</h1>
        <p style="margin: 11px 0 30px; max-width: 52ch; font-size: 1.02rem; line-height: 1.6; color: var(--text-muted); text-wrap: pretty;">Say what you want the council to consider, and what would change your mind.</p>

        <label style="display: block; margin-bottom: 18px;"><span style="display: block; font-family: var(--font-label); font-size: .78rem; letter-spacing: .03em; color: var(--text-faint); margin-bottom: 7px;">Title</span><input onInput="{{ onTitle }}" value="{{ draftTitle }}" placeholder="What should the council consider?" maxlength="160" style="width: 100%; box-sizing: border-box; padding: 10px 13px; font: inherit; font-size: 1.05rem; font-family: var(--font-display); color: var(--text); caret-color: var(--gold-600); border: 0; outline: 0; background: var(--surface-raised); box-shadow: var(--shadow-inset), inset 0 0 0 1.5px var(--gold-200); border-radius: var(--radius-md); transition: box-shadow 150ms ease;" style-hover="box-shadow: var(--shadow-inset), inset 0 0 0 1.5px var(--gold-400);" style-focus="box-shadow: var(--shadow-inset), inset 0 0 0 2px var(--gold-500), 0 0 0 3px var(--focus-ring);"></label>

        <label style="display: block; max-width: 280px; margin-bottom: 18px;"><span style="display: block; font-family: var(--font-label); font-size: .78rem; letter-spacing: .03em; color: var(--text-faint); margin-bottom: 7px;">Board</span><select onChange="{{ onBoard }}" value="{{ board }}" style="width: 100%; box-sizing: border-box; padding: 10px 32px 10px 13px; font: inherit; font-size: 1rem; font-family: var(--font-body); color: var(--text); border: 0; outline: 0; appearance: none; -webkit-appearance: none; cursor: pointer; background-color: var(--surface-raised); background-image: url('data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2211%22%20height=%227%22%20viewBox=%220%200%2011%207%22%3E%3Cpath%20d=%22M1%201l4.5%204.5L10%201%22%20fill=%22none%22%20stroke=%22%23B08A3A%22%20stroke-width=%221.6%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 13px center; box-shadow: var(--shadow-inset), inset 0 0 0 1.5px var(--gold-200); border-radius: var(--radius-md); transition: box-shadow 150ms ease;" style-hover="box-shadow: var(--shadow-inset), inset 0 0 0 1.5px var(--gold-400);" style-focus="box-shadow: var(--shadow-inset), inset 0 0 0 2px var(--gold-500), 0 0 0 3px var(--focus-ring);"><sc-for list="{{ boardOptions }}" as="b" hint-placeholder-count="5"><option value="{{ b.slug }}">{{ b.name }}</option></sc-for></select></label>

        <x-import component-from-global-scope="ImladrisDesignSystem_c3e027.Composer" context="new_thread" submit-label="Post" placeholder="Open with the strongest version of your question…" identity="Erestor" identity-seed="erestor" toolbar-open="true" allow-anonymous="true" anonymous-disclosure="Your name is hidden from other members; moderators can still see it." max-length="{{ postLimit }}" value="{{ bodyDraft }}" onChange="{{ onBody }}" onSubmit="{{ postTopic }}" draft-saved="{{ bodyStarted }}" count="{{ bodyCount }}" count-over="{{ bodyOver }}" error="{{ composerError }}" hint-size="100%,270px"></x-import>

        <div style="display: flex; align-items: center; gap: 16px; margin-top: 14px;">
          <a href="../board-index/BoardIndex.dc.html" style="font-family: var(--font-label); font-size: .82rem; letter-spacing: .03em; color: var(--text-faint); text-decoration: none;" style-hover="color: var(--text-body);">Cancel</a>
          <sc-if value="{{ bodyStarted }}" hint-placeholder-val="{{ false }}"><span style="font-family: var(--font-mono); font-size: .71rem; color: var(--text-faint);">Draft kept on this device.</span></sc-if>
        </div>

      </div>
    </div>

  </div>

  <sc-if value="{{ posted }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; left: 50%; bottom: 34px; z-index: 40; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 999px; background: var(--green-800); color: var(--parchment-50); box-shadow: var(--shadow-lg); animation: cpRise 220ms ease-out;">
      <svg width="12" height="12" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L59 41 L94 50 L59 59 L50 94 L41 59 L6 50 L41 41 Z" fill="var(--gold-400)"></path></svg>
      <span style="font-family: var(--font-label); font-size: .85rem; letter-spacing: .03em;">Topic opened in {{ boardName }}.</span>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;board&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;introductions&quot;,&quot;the-archive&quot;,&quot;the-valley&quot;,&quot;interpretability&quot;,&quot;evaluations&quot;,&quot;audit-trails&quot;,&quot;capability-disclosure&quot;],&quot;default&quot;:&quot;the-valley&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Draft&quot;},&quot;showRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Panels&quot;}}">
/* The rail's board list. Chrome, not content: these eight boards and these four
   unread counts must match templates/board-index/, templates/forum-inbox/ (where
   they are derived from THREADS) and templates/search/. `locked` is this surface's
   own concern — a board you may not post to — and does not change the list. */
const BOARDS = [
  { cat: 'The Commons', boards: [
    { slug: 'announcements', name: 'announcements', unread: 0, locked: true },
    { slug: 'introductions', name: 'introductions', unread: 0 },
    { slug: 'the-archive', name: 'the-archive', unread: 1 },
    { slug: 'the-valley', name: 'the-valley', unread: 0 },
  ] },
  { cat: 'Vilya · Expose', boards: [
    { slug: 'interpretability', name: 'interpretability', unread: 1 },
    { slug: 'evaluations', name: 'evaluations', unread: 2 },
    { slug: 'audit-trails', name: 'audit-trails', unread: 2 },
    { slug: 'capability-disclosure', name: 'capability-disclosure', unread: 0 },
  ] },
];

/* Presence is public and says nothing about the reader, so it is rail furniture:
   the same roster hangs under the same rail on every surface. Duplicated for the
   same reason the board list is — keep it in step with the other three. */
const ROSTER = [
  { name: 'Erestor', username: 'erestor', where: 'the-archive', presence: 'online', gilt: true, staff: true },
  { name: 'Galadriel', username: 'galadriel', where: 'evaluations', presence: 'online', gilt: true },
  { name: 'Glorfindel', username: 'glorfindel', where: 'audit-trails', presence: 'online' },
  { name: 'Arwen Undómiel', username: 'arwen', where: 'interpretability', presence: 'online' },
  { name: 'Elrond', username: 'elrond', where: 'announcements', presence: 'away', gilt: true, staff: true },
  { name: 'Lindir', username: 'lindir', title: 'Member', presence: 'away' },
  { name: 'Círdan', username: 'cirdan', where: 'introductions', presence: 'online' },
  { name: 'Elladan', username: 'elladan', where: 'the-valley', presence: 'away', staff: true },
];

// announcements is warden-only, so it is not a destination a member can pick.
const OPEN = BOARDS.reduce((acc, c) => acc.concat(c.boards.filter((b) => !b.locked)), []);

const POST_LIMIT = 20000;

class Component extends DCLogic {
  state = {
    railOpen: (this.props || {}).showRail !== false,
    board: (this.props || {}).board || 'the-valley',
    draftTitle: '',
    bodyDraft: '',
    composerError: '',
    posted: false,
  };

  componentDidMount() {
    this._keys = (e) => {
      if (!(e.metaKey || e.ctrlKey)) return;
      if (String(e.key).toLowerCase() === 'b') { e.preventDefault(); this.setState((s) => ({ railOpen: !s.railOpen })); }
    };
    window.addEventListener('keydown', this._keys);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._keys); clearTimeout(this._t); }

  componentDidUpdate(prev) {
    const p = this.props || {}, q = prev || {}, s = this.state;
    const rail = p.showRail !== false;
    if (q.showRail !== p.showRail && s.railOpen !== rail) this.setState({ railOpen: rail });
    if (p.board && q.board !== p.board && s.board !== p.board) this.setState({ board: p.board });
  }

  counter(v, max) {
    const n = (v || '').length;
    return n >= max * 0.9 ? n.toLocaleString() + ' / ' + max.toLocaleString() : '';
  }

  renderVals() {
    const s = this.state;
    const current = OPEN.find((b) => b.slug === s.board) || OPEN[0];

    return {
      railOpen: s.railOpen, railClosed: !s.railOpen,
      toggleRail: () => this.setState((st) => ({ railOpen: !st.railOpen })),
      roster: ROSTER.map((m) => Object.assign({}, m, { href: '../user-profile/UserProfile.dc.html', self: m.username === 'erestor' })), onlineCount: 34, rosterMax: 5,

      // The rail shows all eight boards — it is chrome and must match the other
      // surfaces. A board you may not post to is shown and not pickable, rather
      // than quietly missing.
      categories: BOARDS.map((c) => ({
        key: c.cat,
        name: c.cat,
        boards: c.boards.map((b) => ({
          key: b.slug,
          name: b.name,
          unread: b.unread,
          unreadLabel: b.unread + ' unread in ' + b.name,
          locked: !!b.locked,
          lockedTitle: 'Only wardens may open a topic here',
        })),
      })),
      pickBoard: (slug) => this.setState({ board: slug }),
      viewer: { name: 'Erestor', username: 'erestor', presence: 'online' },

      board: s.board,
      boardName: current.name,
      boardOptions: OPEN,
      onBoard: (e) => this.setState({ board: e.target.value }),

      draftTitle: s.draftTitle,
      onTitle: (e) => this.setState({ draftTitle: e.target.value, composerError: '' }),
      postLimit: POST_LIMIT,
      bodyDraft: s.bodyDraft,
      onBody: (e) => this.setState({ bodyDraft: e.target.value, composerError: '' }),
      bodyStarted: s.bodyDraft.length > 0 || s.draftTitle.length > 0,
      bodyCount: this.counter(s.bodyDraft, POST_LIMIT),
      bodyOver: s.bodyDraft.length > POST_LIMIT,
      composerError: s.composerError,
      postTopic: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (s.draftTitle.trim().length < 3) { this.setState({ composerError: 'Give the topic a title before you open it.' }); return; }
        this.setState({ draftTitle: '', bodyDraft: '', composerError: '', posted: true });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ posted: false }), 2600);
      },
      posted: s.posted,
    };
  }
}

</script>
</body>
</html>
