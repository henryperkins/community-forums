<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Search" description="/search — finding a topic you cannot name the location of. Its own surface, not a pane of the board index: a query is neither a place nor a state, it is a third way in, and it needs the whole main pane for the field, the refinements and the ranked results. Shared board rail on the left; no third pane, because a result hands off to the topic it names." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  html { scrollbar-gutter: stable; }
  body { margin: 0; background: var(--surface-page); }
  @keyframes srRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes srFade { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>

<div data-screen-label="Search" style="height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body);">

  <div style="flex: 0 0 var(--topbar-h); z-index: 20; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: color-mix(in srgb, var(--surface-raised) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-hair); box-sizing: border-box;">
    <span style="display: inline-flex; align-items: center; gap: 10px;">
      <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><g fill="var(--accent)"><path d="M50 3 63.8 16.7 83.2 16.8 83.3 36.2 97 50 83.3 63.8 83.2 83.2 63.8 83.3 50 97 36.2 83.3 16.8 83.2 16.7 63.8 3 50 16.7 36.2 16.8 16.8 36.2 16.7Z" opacity=".2"></path><path d="M50 21 57.5 42.5 79 50 57.5 57.5 50 79 42.5 57.5 21 50 42.5 42.5Z"></path></g></svg>
      <span style="font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; color: var(--text-strong); letter-spacing: .01em;">Imladris</span>
    </span>
    <nav aria-label="Primary" style="display: flex; align-items: center; gap: 4px;">
      <a href="../board-index/BoardIndex.dc.html" style="padding: 6px 12px; border-radius: var(--radius-md); background: transparent; color: var(--text-muted); font-family: var(--font-label); font-size: .82rem; letter-spacing: .02em; text-decoration: none;" style-hover="background: var(--surface-sunken); color: var(--text-body);">Boards</a>
      <a href="../forum-inbox/ForumInbox.dc.html" style="padding: 6px 12px; border-radius: var(--radius-md); background: transparent; color: var(--text-muted); font-family: var(--font-label); font-size: .82rem; letter-spacing: .02em; text-decoration: none;" style-hover="background: var(--surface-sunken); color: var(--text-body);">Inbox</a>
      <a href="#" style="padding: 6px 12px; border-radius: var(--radius-md); background: transparent; color: var(--text-muted); font-family: var(--font-label); font-size: .82rem; letter-spacing: .02em; text-decoration: none;" style-hover="background: var(--surface-sunken); color: var(--text-body);">Messages</a>
    </nav>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 4px;">
      <sc-if value="{{ railOpen }}" hint-placeholder-val="{{ true }}"><button onClick="{{ toggleRail }}" aria-pressed="true" title="Hide the board rail (⌘B)" style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; border-radius: var(--radius-sm); background: var(--brand-subtle); color: var(--on-brand-subtle); cursor: pointer;" style-hover="background: var(--surface-sunken); color: var(--text-body);"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.2" y="3.2" width="4" height="9.6" rx="1" fill="currentColor" opacity=".5"></rect></svg></button></sc-if>
      <sc-if value="{{ railClosed }}" hint-placeholder-val="{{ false }}"><button onClick="{{ toggleRail }}" aria-pressed="false" title="Show the board rail (⌘B)" style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-faint); cursor: pointer;" style-hover="background: var(--surface-sunken); color: var(--text-body);"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"></rect></svg></button></sc-if>
    </span>
    <span aria-hidden="true" style="flex: none; width: 1px; height: 22px; background: var(--border-hair);"></span>
    <span style="display: inline-flex; align-items: center; gap: 14px;">
      <span style="flex: none; white-space: nowrap;"><x-import component-from-global-scope="ImladrisDesignSystem_c3e027.Button" size="sm" href="../compose/Compose.dc.html" hint-size="120px,32px">New topic</x-import></span>
      <span style="display: inline-flex; align-items: center; gap: 9px;"><span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--gold-100); color: var(--gold-700); font-family: var(--font-label); font-size: .72rem;">ER</span><span style="font-family: var(--font-label); font-size: .8rem; color: var(--text-body);">Erestor</span></span>
    </span>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; align-items: stretch;">

    <sc-if value="{{ railOpen }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Boards" style="flex: 0 0 var(--sidebar-w); display: flex; flex-direction: column; gap: 2px; padding: 20px 12px 32px; overflow-y: auto; box-sizing: border-box; background: var(--surface-sunken); border-right: 1px solid var(--border-hair); animation: srFade 160ms;">
      <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="2">
        <span style="display: block; padding: 16px 0 6px 12px; font-family: var(--font-label); font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-faint);">{{ cat.name }}</span>
        <sc-for list="{{ cat.boards }}" as="b" hint-placeholder-count="4">
          <a href="../board-page/BoardPage.dc.html" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px; box-sizing: border-box; border-left: 2px solid transparent; border-radius: 0 var(--radius-md) var(--radius-md) 0; background: transparent; color: var(--text-muted); font-family: var(--font-label); font-size: .84rem; letter-spacing: .02em; text-decoration: none;" style-hover="background: var(--surface-page); color: var(--text-body);"><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ b.name }}</span><sc-if value="{{ b.hasUnread }}" hint-placeholder-val="{{ false }}"><span title="{{ b.unreadLabel }}" aria-label="{{ b.unreadLabel }}" style="flex: 0 0 auto; padding: 0 6px; text-align: center; font-family: var(--font-mono); font-size: .66rem; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink);">{{ b.unread }}</span></sc-if></a>
        </sc-for>
      </sc-for>
      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-hair);">
        <x-import component-from-global-scope="ImladrisDesignSystem_c3e027.PresenceList" people="{{ roster }}" count="{{ onlineCount }}" max="{{ rosterMax }}" layout="list" hint-size="100%,230px"></x-import>
        <a href="../users-online/UsersOnline.dc.html" style="display: inline-block; margin: 10px 0 0 8px; font-family: var(--font-label); font-size: .74rem; letter-spacing: .04em; color: var(--text-muted); text-decoration: none;" style-hover="color: var(--accent);">See everyone</a>
      </div>
    </nav>
    </sc-if>

    <div style="flex: 1 1 0; min-width: 0; overflow-y: auto; padding: 26px 40px 90px; box-sizing: border-box;">
      <div style="max-width: 760px; margin: 0 auto; animation: srRise 200ms ease-out;">

        <h1 style="margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 2.2rem; line-height: 1.08; letter-spacing: -0.01em; color: var(--text-strong);">Search the council</h1>

        <!-- The engraved well the forms layer specifies: no border, the chamfered
             outline drawn as background layers. -->
        <form onSubmit="{{ submit }}" style="display: flex; align-items: center; gap: 12px; margin-top: 22px;">
          <input onInput="{{ onQuery }}" value="{{ query }}" type="search" aria-label="Search the council" placeholder="A phrase, a title, a member…" style="flex: 1; min-width: 0; padding: 12px 15px; font: inherit; font-size: 1.05rem; font-family: var(--font-body); color: var(--text); caret-color: var(--gold-600); border: 0; outline: 0; background: var(--surface-raised); box-shadow: var(--shadow-inset), inset 0 0 0 1.5px var(--gold-200); clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); transition: box-shadow 150ms ease;" style-hover="box-shadow: var(--shadow-inset), inset 0 0 0 1.5px var(--gold-400);" style-focus="box-shadow: var(--shadow-inset), inset 0 0 0 2px var(--gold-500), inset 0 0 0 5px color-mix(in srgb, var(--gold-100) 60%, transparent);">
          <span style="flex: none;"><x-import component-from-global-scope="ImladrisDesignSystem_c3e027.Button" onClick="{{ submit }}" hint-size="100px,40px">Search</x-import></span>
        </form>

        <!-- Same Viewing grammar, this surface's axes: scope (where to look) and
             order (how to rank). No peek, no density — results are not a list you
             live in. -->
        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px 22px; margin-top: 24px; padding: 11px 0; border-top: 1px solid var(--border-hair); border-bottom: 1px solid var(--border-hair);">
          <span style="font-family: var(--font-label); font-size: .64rem; letter-spacing: .2em; text-transform: uppercase; color: var(--text-faint);">Viewing</span>
          <span role="group" aria-label="Scope" style="display: flex; align-items: center; flex-wrap: wrap; gap: 3px;">
            <sc-for list="{{ scopes }}" as="o" hint-placeholder-count="4">
              <sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}"><button onClick="{{ o.pick }}" aria-pressed="true" style="padding: 5px 12px; border: 0; border-radius: 999px; background: var(--brand-subtle); box-shadow: var(--gilt); color: var(--on-brand-subtle); font-family: var(--font-label); font-size: .78rem; letter-spacing: .03em; white-space: nowrap; cursor: pointer;">{{ o.label }}</button></sc-if>
              <sc-if value="{{ o.off }}" hint-placeholder-val="{{ true }}"><button onClick="{{ o.pick }}" aria-pressed="false" style="padding: 5px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--text-muted); font-family: var(--font-label); font-size: .78rem; letter-spacing: .03em; white-space: nowrap; cursor: pointer; transition: background 140ms ease, color 140ms ease;" style-hover="background: var(--surface-sunken); color: var(--text-body);">{{ o.label }}</button></sc-if>
            </sc-for>
          </span>
          <span style="flex: 1; min-width: 12px;"></span>
          <span role="group" aria-label="Order" style="display: flex; align-items: center; flex-wrap: wrap; gap: 3px;">
            <sc-for list="{{ orders }}" as="o" hint-placeholder-count="2">
              <sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}"><button onClick="{{ o.pick }}" aria-pressed="true" style="padding: 5px 12px; border: 0; border-radius: 999px; background: var(--brand-subtle); box-shadow: var(--gilt); color: var(--on-brand-subtle); font-family: var(--font-label); font-size: .78rem; letter-spacing: .03em; white-space: nowrap; cursor: pointer;">{{ o.label }}</button></sc-if>
              <sc-if value="{{ o.off }}" hint-placeholder-val="{{ true }}"><button onClick="{{ o.pick }}" aria-pressed="false" style="padding: 5px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--text-muted); font-family: var(--font-label); font-size: .78rem; letter-spacing: .03em; white-space: nowrap; cursor: pointer; transition: background 140ms ease, color 140ms ease;" style-hover="background: var(--surface-sunken); color: var(--text-body);">{{ o.label }}</button></sc-if>
            </sc-for>
          </span>
        </div>

        <p style="margin: 11px 0 0; font-family: var(--font-mono); font-size: .72rem; color: var(--text-faint);">{{ resultCount }}</p>

        <div style="margin-top: 22px;">
          <sc-for list="{{ results }}" as="r" hint-placeholder-count="3">
            <div style="padding: 17px 0; border-bottom: 1px solid var(--border-hair);">
              <p style="margin: 0; font-family: var(--font-label); font-size: .74rem; letter-spacing: .04em; color: var(--text-faint);">{{ r.byline }}</p>
              <a href="../thread-view/ThreadView.dc.html" style="display: block; margin-top: 5px; font-family: var(--font-display); font-weight: 500; font-size: 1.28rem; line-height: 1.24; color: var(--text-strong); text-decoration: none; text-wrap: pretty;" style-hover="color: var(--accent);">{{ r.title }}</a>
              <p style="margin: 6px 0 0; max-width: 62ch; font-size: .96rem; line-height: 1.6; color: var(--text-muted); text-wrap: pretty;">{{ r.snippet }}</p>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 54px 0; text-align: center;">
            <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true" style="opacity: .3;"><path d="M50 6 L59 41 L94 50 L59 59 L50 94 L41 59 L6 50 L41 41 Z" fill="var(--gold-600)"></path></svg>
            <p style="margin: 12px 0 3px; font-family: var(--font-display); font-size: 1.35rem; color: var(--text-strong);">Nothing matches that.</p>
            <p style="margin: 0; font-size: .96rem; color: var(--text-muted);">Try a shorter phrase, or widen the scope above.</p>
          </div>
        </sc-if>

      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;query&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;rollback&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Query&quot;},&quot;scope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;topics&quot;,&quot;replies&quot;,&quot;mine&quot;],&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Query&quot;},&quot;showRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Panels&quot;}}">
/* The rail's board list. Chrome, not content: these eight boards and these
   unread counts must match templates/board-index/ and templates/forum-inbox/. */
const BOARDS = [
  { cat: 'The Commons', boards: [
    { name: 'announcements', unread: 0 }, { name: 'introductions', unread: 0 },
    { name: 'the-archive', unread: 1 }, { name: 'the-valley', unread: 0 },
  ] },
  { cat: 'Vilya · Expose', boards: [
    { name: 'interpretability', unread: 1 }, { name: 'evaluations', unread: 2 },
    { name: 'audit-trails', unread: 2 }, { name: 'capability-disclosure', unread: 0 },
  ] },
];

/* Presence is public and says nothing about the reader, so it is rail furniture:
   the same roster hangs under the same rail on every surface. Duplicated for the
   same reason the board list is — keep it in step with the other three. */
const ROSTER = [
  { name: 'Erestor', username: 'erestor', where: 'the-archive', presence: 'online', gilt: true, staff: true },
  { name: 'Galadriel', username: 'galadriel', where: 'evaluations', presence: 'online', gilt: true },
  { name: 'Glorfindel', username: 'glorfindel', where: 'audit-trails', presence: 'online' },
  { name: 'Arwen Undómiel', username: 'arwen', where: 'interpretability', presence: 'online' },
  { name: 'Elrond', username: 'elrond', where: 'announcements', presence: 'away', gilt: true, staff: true },
  { name: 'Lindir', username: 'lindir', title: 'Member', presence: 'away' },
  { name: 'Círdan', username: 'cirdan', where: 'introductions', presence: 'online' },
  { name: 'Elladan', username: 'elladan', where: 'the-valley', presence: 'away', staff: true },
];

const SCOPES = [
  { key: 'all', label: 'Everything' },
  { key: 'topics', label: 'Topics' },
  { key: 'replies', label: 'Replies' },
  { key: 'mine', label: 'Mine' },
];

const ORDERS = [
  { key: 'relevance', label: 'Relevance' },
  { key: 'newest', label: 'Newest' },
];

const RESULTS = [
  { kind: 'Topic', mine: false, board: 'audit-trails', age: 5, title: 'Who changed what — and can you prove the rollback?', snippet: 'Every change should answer three questions: who changed what, was it authorized, and can you prove the rollback?', terms: ['rollback', 'audit', 'change'] },
  { kind: 'Reply', mine: true, board: 'audit-trails', age: 30, title: 'Re: Who changed what — and can you prove the rollback?', snippet: 'We ran the rollback drill on Tuesday. Two actors could edit the same setting with no record of precedence.', terms: ['rollback', 'drill', 'precedence'] },
  { kind: 'Reply', mine: false, board: 'evaluations', age: 52, title: 'Re: Evaluations as ritual, not gate', snippet: 'If a change cannot be rolled back cleanly, that is itself a verdict worth recording.', terms: ['rollback', 'eval', 'verdict'] },
  { kind: 'Topic', mine: true, board: 'the-archive', age: 14, title: 'Where should ratified decisions live?', snippet: 'We keep re-litigating settled questions because the record scatters. A proposal: every decision gets a canonical topic.', terms: ['record', 'decision', 'archive'] },
];

class Component extends DCLogic {
  state = {
    railOpen: (this.props || {}).showRail !== false,
    query: (this.props || {}).query || 'rollback',
    submitted: (this.props || {}).query || 'rollback',
    scope: (this.props || {}).scope || 'all',
    order: 'relevance',
  };

  componentDidMount() {
    this._keys = (e) => {
      if (!(e.metaKey || e.ctrlKey)) return;
      if (String(e.key).toLowerCase() === 'b') { e.preventDefault(); this.setState((s) => ({ railOpen: !s.railOpen })); }
    };
    window.addEventListener('keydown', this._keys);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._keys); }

  componentDidUpdate(prev) {
    const p = this.props || {}, q = prev || {}, s = this.state;
    const rail = p.showRail !== false;
    if (q.showRail !== p.showRail && s.railOpen !== rail) this.setState({ railOpen: rail });
    if (p.scope && q.scope !== p.scope && s.scope !== p.scope) this.setState({ scope: p.scope });
    if (p.query !== undefined && q.query !== p.query && s.submitted !== p.query) this.setState({ query: p.query, submitted: p.query });
  }

  renderVals() {
    const s = this.state;
    const term = s.submitted.trim().toLowerCase();
    let rows = RESULTS.filter((x) => {
      if (s.scope === 'topics' && x.kind !== 'Topic') return false;
      if (s.scope === 'replies' && x.kind !== 'Reply') return false;
      if (s.scope === 'mine' && !x.mine) return false;
      return true;
    });
    if (term) {
      rows = rows.filter((x) => x.terms.some((t) => t.indexOf(term) === 0 || term.indexOf(t) === 0) || x.title.toLowerCase().indexOf(term) >= 0);
    }
    if (s.order === 'newest') rows = rows.slice().sort((a, b) => a.age - b.age);

    return {
      railOpen: s.railOpen, railClosed: !s.railOpen,
      toggleRail: () => this.setState((st) => ({ railOpen: !st.railOpen })),
      roster: ROSTER, onlineCount: 34, rosterMax: 5,
      categories: BOARDS.map((c) => ({
        name: c.cat,
        boards: c.boards.map((b) => ({
          name: b.name, unread: String(b.unread), hasUnread: b.unread > 0,
          unreadLabel: b.unread + ' unread in ' + b.name,
        })),
      })),

      query: s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState((st) => ({ submitted: st.query })); },

      scopes: SCOPES.map((o) => ({ label: o.label, on: s.scope === o.key, off: s.scope !== o.key, pick: () => this.setState({ scope: o.key }) })),
      orders: ORDERS.map((o) => ({ label: o.label, on: s.order === o.key, off: s.order !== o.key, pick: () => this.setState({ order: o.key }) })),

      resultCount: (term ? rows.length + (rows.length === 1 ? ' result for “' : ' results for “') + s.submitted.trim() + '”' : rows.length + ' results')
        + (s.order === 'newest' ? ' · newest first' : ' · by relevance'),
      results: rows.map((x) => ({ title: x.title, snippet: x.snippet, byline: x.kind + ' · ' + x.board })),
      noResults: rows.length === 0,
    };
  }
}

</script>
</body>
</html>
