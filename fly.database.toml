app = "community-forums-db"
primary_region = "iad"

[build]
  dockerfile = "deploy/mariadb/Dockerfile"

[env]
  MARIADB_AUTO_UPGRADE = "1"
  MARIADB_DATABASE = "retroboards"
  MARIADB_USER = "retro"

[[mounts]]
  source = "mariadb_data"
  destination = "/var/lib/mysql"
  initial_size = "10gb"

[[services]]
  internal_port = 3306
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
