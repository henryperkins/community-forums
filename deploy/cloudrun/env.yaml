# Non-secret configuration shared by the Cloud Run service and the cron job --
# the Cloud Run counterpart of wrangler.jsonc `vars`. Applied by
# deploy/cloudrun/configure.sh; secrets are wired there from Secret Manager.
# Runbook: docs/runbooks/deployment-cloud-run.md
APP_ENV: production
APP_DEBUG: "false"
APP_URL: https://forum.candidary.online
SESSION_SECURE: "true"
SECURITY_HSTS: "true"
MAIL_DRIVER: cloudflare_smtp
MAIL_FROM: noreply@candidary.online
MAIL_TIMEOUT_SECONDS: "30"

# Cloud SQL through Cloud Run's built-in connector: a Unix socket the platform
# serves over IAM-authenticated, encrypted transport, so no TLS settings here.
DB_SOCKET: /cloudsql/rising-woods-449718-v6:us-east4:imladris-boards
DB_DATABASE: retroboards
DB_USERNAME: retroboards_app
DB_EMULATE_PREPARES: "true"

# /data is the Cloud Storage bucket Cloud Run mounts (configure.sh); the
# container filesystem is in memory and does not survive a restart.
UPLOADS_PATH: /data/media
PACKAGES_STORAGE_PATH: /data/packages
# The single instance owns this ephemeral ledger; restart resets its limits.
RATELIMIT_PATH: /var/www/html/storage/ratelimit

# Requests arrive Worker -> Google Front End -> container. The Worker sets
# X-Forwarded-For to the visitor's CF-Connecting-IP, Google appends the
# Worker's egress address, and the container's peer is Google's link-local
# proxy. So trust that proxy and Cloudflare's published ranges
# (https://www.cloudflare.com/ips/) and nothing else: ClientIdentifier then
# lands on the visitor. Safe only because the service requires an IAM token
# that only the Worker holds -- nobody else can put a header in front of it.
TRUSTED_PROXIES: 169.254.0.0/16,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32

# The service migrates on boot; configure.sh turns this off for the job so a
# cron tick never races a deploy's migration.
RUN_MIGRATIONS: "true"
